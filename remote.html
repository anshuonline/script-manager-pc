<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Teleprompter Remote</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      padding: 0;
      background: #08080d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 20px;
      text-align: center;
      background: rgba(18,18,28,0.9);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 1px; color: #a599ff; }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 16px;
      padding: 20px;
      flex: 1;
    }
    
    .btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    .btn:active {
      background: rgba(255,255,255,0.15);
      transform: scale(0.95);
    }
    .btn.play-pause {
      grid-column: span 2;
      background: #7c3aed;
      border-color: #8b5cf6;
      font-size: 28px;
    }
    .btn.play-pause:active {
      background: #6d28d9;
    }
    .btn.danger {
      grid-column: span 2;
      background: rgba(255, 107, 129, 0.1);
      border-color: rgba(255, 107, 129, 0.3);
      color: #ff6b81;
    }
    .icon { font-size: 32px; }
  </style>
</head>
<body>
  <header>
    <h1>📱 STUDIO REMOTE</h1>
  </header>
  <div class="grid">
    <button class="btn play-pause" onclick="sendAction('playPause')">
      <span class="icon">⏯️</span>
      Play / Pause
    </button>
    <button class="btn" onclick="sendAction('speedUp')">
      <span class="icon">⏫</span>
      Speed +
    </button>
    <button class="btn" onclick="sendAction('speedDown')">
      <span class="icon">⏬</span>
      Speed -
    </button>
    <button class="btn" onclick="sendAction('scrollUp')">
      <span class="icon">🔼</span>
      Scroll Up
    </button>
    <button class="btn" onclick="sendAction('scrollDown')">
      <span class="icon">🔽</span>
      Scroll Down
    </button>
    <button class="btn danger" onclick="sendAction('exit')">
      <span class="icon">❌</span>
      Exit Prompter
    </button>
  </div>

  <script>
    function sendAction(action) {
      if (navigator.vibrate) navigator.vibrate(50);
      fetch('/api/tp/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action })
      }).catch(err => console.error('Error sending action:', err));
    }
  </script>
</body>
</html>
